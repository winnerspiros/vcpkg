name: djsugar buildenv

on:
  push:
    branches: [djsugar-*]
  workflow_dispatch:

permissions:
  contents: write # Publish the buildenv zip as a GitHub release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            deps_name: arm64-android-rel
            vcpkg_path: /home/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: arm64-android-release
            vcpkg_host_triplet: x64-linux-release
            android_api: 35
            android_version: 35.0.0
            android_ndk: 28.0.13004108
            check_disk_space: df -h
            cache_root: /home/runner
            notes: Android arm64 release buildenv for djsugar (Qt 6.12.1 branch snapshot, Vulkan).
          - os: macos-15
            deps_name: arm64-ios-rel
            vcpkg_path: /Users/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: arm64-ios-release
            vcpkg_host_triplet: arm64-osx-min1100-release
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
            check_disk_space: df -h
            cache_root: /Users/runner
            notes: iOS arm64 (iOS 14+) release buildenv for djsugar.
          - os: macos-15
            deps_name: arm64-osx-rel
            vcpkg_path: /Users/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: arm64-osx-min1100-release
            vcpkg_host_triplet: arm64-osx-min1100-release
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
            check_disk_space: df -h
            cache_root: /Users/runner
            notes: macOS arm64 (macOS 11+) release buildenv for djsugar.
          - os: windows-2022
            deps_name: x64-windows-rel
            vcpkg_path: C:/djv
            vcpkg_bootstrap: ./bootstrap-vcpkg.bat
            vcpkg_triplet: x64-windows-release
            vcpkg_host_triplet: x64-windows-release
            check_disk_space: df -h
            cache_root: C:/runner-cache
            notes: Windows x64 release buildenv for djsugar.
          - os: ubuntu-22.04
            deps_name: x64-linux-rel
            vcpkg_path: /home/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: x64-linux-appimage
            vcpkg_host_triplet: x64-linux-appimage
            check_disk_space: df -h
            cache_root: /home/runner
            notes: Linux x64 release buildenv for the djsugar AppImage (glibc 2.35).
          - os: macos-15-intel
            deps_name: x64-osx-rel
            vcpkg_path: /Users/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: x64-osx-min1100-release
            vcpkg_host_triplet: x64-osx-min1100-release
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
            check_disk_space: df -h
            cache_root: /Users/runner
            notes: macOS x64 (macOS 11+) release buildenv for djsugar.
          - os: windows-11-arm
            deps_name: arm64-windows-rel
            vcpkg_path: C:/djv
            vcpkg_bootstrap: ./bootstrap-vcpkg.bat
            vcpkg_triplet: arm64-windows-release
            vcpkg_host_triplet: arm64-windows-release
            check_disk_space: df -h
            cache_root: C:/runner-cache
            notes: Windows arm64 release buildenv for djsugar.
          - os: ubuntu-22.04-arm
            deps_name: arm64-linux-rel
            vcpkg_path: /home/runner/mixxx-vcpkg
            vcpkg_bootstrap: ./bootstrap-vcpkg.sh
            vcpkg_triplet: arm64-linux-release
            vcpkg_host_triplet: arm64-linux-release
            check_disk_space: df -h
            cache_root: /home/runner
            notes: Linux arm64 release buildenv for the djsugar AppImage (glibc 2.35).
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      DEPS_BASE_NAME: mixxx-deps
      MIXXX_VERSION: 2.7-djsugar
    name: ${{ matrix.deps_name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out git repository
      uses: actions/checkout@v4
      with:
        path: mixxx-vcpkg

      # The ephemeral space doesn't seem consistent between runs. Sometimes it is available directly on the root (/), sometime on the mount folder (/mnt)
      # If the ephemeral storage is available under a seperate drive, we bind-mount as thee `vcpkg_path`
    - name: Move checkout and use the ephemeral storage if available
      if: runner.os == 'Linux'
      run: |
        set -x
        if [ -d /mnt ]; then
          mntSpace=$(df --output=avail /mnt | tail -n 1)
          rootSpace=$(df --output=avail / | tail -n 1)
          if [ $mntSpace -gt $rootSpace ]; then
            mkdir ${{ matrix.vcpkg_path }}
            sudo mount -o bind /mnt ${{ matrix.vcpkg_path }}
            sudo chown -R `id -u`:`id -g` ${{ matrix.vcpkg_path }}
            rsync -a ${{ github.workspace }}/mixxx-vcpkg/ ${{ matrix.vcpkg_path }}
            exit 0
          fi
        fi
        # In case we cannot use the ephemeral disk space because it either doesn't 
        # exist or is too small, we free as much as possible on the root.
        sudo rm -rf /home/packer                 # Free up 677M
        sudo rm -rf /opt/az                      # Free up 649M
        sudo rm -rf /opt/google                  # Free up 378M
        sudo rm -rf /opt/hostedtoolcache/CodeQL  # Free up 1.6G
        sudo rm -rf /opt/hostedtoolcache/go      # Free up 808M
        sudo rm -rf /opt/hostedtoolcache/node    # Free up 532M
        sudo rm -rf /opt/hostedtoolcache/PyPy    # Free up 520M
        sudo rm -rf /opt/hostedtoolcache/Python  # Free up 1.5G
        sudo rm -rf /opt/microsoft               # Free up 781M
        sudo rm -rf /opt/pipx                    # Free up 499M
        sudo rm -rf /usr/lib/google-cloud-sdk    # Free up 957M
        sudo rm -rf /usr/local/julia1.11.7       # Free up 996M
        sudo rm -rf /usr/local/share/powershell  # Free up 1.3G
        sudo rm -rf /usr/share/dotnet            # Free up 3.4G
        sudo rm -rf /usr/share/swift             # Free up 3.2G
        sudo rm -rf /usr/local/share/vcpkg       # Size unknown, but obvious duplicate
        sudo rm -rf /opt/ghc                     # Free up ~2G (Haskell)
        sudo rm -rf /usr/local/graalvm           # Free up ~1G
        sudo rm -rf /usr/local/lib/node_modules  # Free up ~500M
        sudo rm -rf /usr/share/postgresql        # Free up ~1G
        sudo rm -rf /usr/share/mysql             # Free up ~800M
        sudo rm -rf /usr/local/lib/php           # Free up ~600M
        sudo rm -rf /opt/hostedtoolcache/Ruby    # Free up ~300M
        sudo rm -rf /opt/hostedtoolcache/Rust    # Free up ~700M
        rsync -a ${{ github.workspace }}/mixxx-vcpkg/ ${{ matrix.vcpkg_path }}
      
    # Short build path: Windows path limits (microsoft/vcpkg#8272)
    - name: Move checkout
      if: runner.os != 'Linux'
      run: cmake -E copy_directory "${{ github.workspace }}/mixxx-vcpkg" "${{ matrix.vcpkg_path }}"

    - name: "Work around actions/runner-images#9966"
      if: matrix.os == 'macos-15-intel'
      run: |
        brew list -1 | grep python@ | while read formula; do
          brew unlink $formula
          brew link --overwrite $formula
        done

    - name: "[macOS] Install dependencies for vcpkg"
      if: runner.os == 'macOS'
      run: |
        brew update-if-needed && brew install automake nasm autoconf-archive libtool
        sudo xcode-select --switch "$DEVELOPER_DIR"
        xcrun --show-sdk-version

    - name: "[Ubuntu] Install dependencies for vcpkg"
      if: runner.os == 'Linux'
      run: |
          # Install all dependencies needed for the host (x64-linux-release). 
          # Most of them are related to Qt-related ports build also include some build essentials as well as the Android SDK manager
          sudo apt-get update && \
          sudo apt-get install -y \
            '^libxcb.*-dev' \
            autoconf \
            autoconf-archive \
            automake \
            bison \
            flex \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libdrm-dev \
            libgbm-dev \
            libghc-resolv-dev \
            libglu1-mesa-dev \
            libltdl-dev \
            libsm-dev \
            libudev-dev \
            libx11-xcb-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            linux-libc-dev \
            nasm \
            pkg-config \
            python3-jinja2

    - name: Read sha_short
      id: vars
      shell: bash
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      working-directory: ${{ matrix.vcpkg_path }}

    - name: Bootstrap vcpkg
      run: ${{ matrix.vcpkg_bootstrap }}
      working-directory: ${{ matrix.vcpkg_path }}

    - name: "[android] Install Android SDK"
      if: startsWith(matrix.deps_name, 'arm64-android')
      run: |
          sudo apt-get install -y \
            google-android-cmdline-tools-13.0-installer \
            openjdk-17-jdk
          yes | sudo sdkmanager "platforms;android-${{ matrix.android_api }}" "platform-tools" "build-tools;${{ matrix.android_version }}" "build-tools;36.0.0" "ndk;${{ matrix.android_ndk }}"
          echo "ANDROID_NDK_HOME=/usr/lib/android-sdk/ndk/${{ matrix.android_ndk }}" >> "${GITHUB_ENV}"
          # Gradle (AGP 9) refuses differing SDK paths; the runner preset ANDROID_HOME elsewhere.
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> "${GITHUB_ENV}"   
          sudo sdkmanager --list_installed

    - name: "[ubuntu/android] Free up APT cachd"
      if: runner.os == 'Linux'
      run: sudo apt-get autoremove -y && sudo apt-get clean

    - name: Check available disk space
      run: ${{ matrix.check_disk_space }}

    # Binary cache: only ports whose ABI hash changed are rebuilt. A Qt or
    # overlay change rebuilds just the affected ports instead of all 151.
    # Source tarballs survive upstream outages (Gradle/GitHub 504s broke runs).
    - name: Restore vcpkg downloads
      uses: actions/cache/restore@v4
      with:
        path: ${{ matrix.cache_root }}/vcpkg-downloads
        key: vcpkg-dl-${{ runner.os }}-${{ github.sha }}
        restore-keys: vcpkg-dl-${{ runner.os }}-

    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ matrix.cache_root }}/vcpkg-bincache
        key: vcpkg-bin-${{ matrix.deps_name }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          vcpkg-bin-${{ matrix.deps_name }}-${{ github.ref_name }}-
          vcpkg-bin-${{ matrix.deps_name }}-

    - name: Use binary cache
      run: |
        mkdir -p "${{ matrix.cache_root }}/vcpkg-bincache"
        mkdir -p ${{ matrix.cache_root }}/vcpkg-downloads
        echo "VCPKG_DOWNLOADS=${{ matrix.cache_root }}/vcpkg-downloads" >> "$GITHUB_ENV"
        echo "VCPKG_BINARY_SOURCES=clear;files,${{ matrix.cache_root }}/vcpkg-bincache,readwrite" >> "$GITHUB_ENV"
        du -sh "${{ matrix.cache_root }}/vcpkg-bincache"

    - name: Build packages
      # Below the 6h job limit so the cache steps still save finished ports.
      timeout-minutes: 320
      run: ./vcpkg install --vcpkg-root=${{ matrix.vcpkg_path }} --clean-after-build --recurse --feature-flags="-compilertracking,manifests,registries,versions" --x-abi-tools-use-exact-versions
      working-directory: ${{ matrix.vcpkg_path }}
      
    - name: Prune binary cache to this build
      # Only after a full success: a partial install would drop cached ports
      # that simply weren't reached yet.
      if: success()
      working-directory: ${{ matrix.vcpkg_path }}
      run: |
        cache=${{ matrix.cache_root }}/vcpkg-bincache
        grep -h '^Abi: ' vcpkg_installed/vcpkg/status | awk '{print $2}' | sort -u > /tmp/keep
        echo "ports in use: $(wc -l < /tmp/keep)"
        if [ -s /tmp/keep ]; then
          find "$cache" -type f -name '*.zip' | while read -r f; do
            grep -qxF "$(basename "$f" .zip)" /tmp/keep || rm -f "$f"
          done
        fi
        du -sh "$cache"

    - name: Save vcpkg downloads
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ matrix.cache_root }}/vcpkg-downloads
          !${{ matrix.cache_root }}/vcpkg-downloads/tools
          !${{ matrix.cache_root }}/vcpkg-downloads/temp
        key: vcpkg-dl-${{ runner.os }}-${{ github.sha }}

    - name: Save vcpkg binary cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ matrix.cache_root }}/vcpkg-bincache
        key: vcpkg-bin-${{ matrix.deps_name }}-${{ github.ref_name }}-${{ github.sha }}

    - name: Upload GitHub Actions artifacts of build logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.deps_name }}
        path: ${{ matrix.vcpkg_path  }}/buildtrees/**/*.log
        archive: true

    - name: Create buildenv archive
      run: ./vcpkg export --vcpkg-root=${{ matrix.vcpkg_path }} --x-all-installed --zip --output=${{ env.DEPS_BASE_NAME }}-${{ env.MIXXX_VERSION }}-${{ matrix.deps_name }}-${{ steps.vars.outputs.sha_short }} --output-dir=${{ matrix.vcpkg_path }}
      working-directory: ${{ matrix.vcpkg_path }}
      
    - name: Publish buildenv as GitHub release
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: ${{ env.DEPS_BASE_NAME }}-${{ env.MIXXX_VERSION }}-${{ matrix.deps_name }}-${{ steps.vars.outputs.sha_short }}
      working-directory: ${{ matrix.vcpkg_path }}
      run: |
        size=$(wc -c < "${NAME}.zip"); echo "zip size: $((size/1048576)) MiB"
        if [ "$size" -ge 2147483648 ]; then echo "::error::buildenv zip exceeds GitHub's 2 GiB asset limit"; exit 1; fi
        cmake -E sha256sum "${NAME}.zip" | tee "${NAME}.zip.sha256"
        gh release create "${NAME}" "${NAME}.zip" "${NAME}.zip.sha256" \
          --repo "${{ github.repository }}" --target "${{ github.sha }}" \
          --title "${NAME}" --notes "${{ matrix.notes }}"
